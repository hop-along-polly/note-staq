name: notestaq

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://notestaq:notestaq-pw@postgres:5432/notestaq
      S3_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET: notestaq-notes
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-me-0123456789}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-note-staq-pw}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notestaq
      POSTGRES_PASSWORD: notestaq-pw
      POSTGRES_DB: notestaq
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notestaq -d notestaq"]
      interval: 2s
      timeout: 3s
      retries: 30

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

  localstack:
    image: localstack/localstack:4.14
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  localstack-data:
